<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0c0a0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lift</title>
<style>
:root{--bg:#0c0a0d;--card:#18131a;--card2:#241d27;--line:#2c2431;--text:#f8f2ef;--mute:#9b8f99;--acc:#ff7a1a;--acc2:#ff3d81;--grad:linear-gradient(135deg,#ffa23d 0%,#ff6a2a 45%,#ff3d81 100%);--danger:#ff4d5e;--good:#4ade80}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(90% 45% at 100% 0%,rgba(255,106,42,.20),transparent 70%),radial-gradient(70% 35% at 0% 100%,rgba(255,61,129,.10),transparent 70%)}
.glow::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,140,60,.22) 1.1px,transparent 1.6px);background-size:9px 9px;-webkit-mask-image:radial-gradient(circle at 100% 0%,#000 0,transparent 42%);mask-image:radial-gradient(circle at 100% 0%,#000 0,transparent 42%)}
main{position:relative;z-index:1;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px);max-width:560px;margin:0 auto}
.kana{font-size:12px;font-weight:800;letter-spacing:.32em;margin:0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
h1{font-size:40px;font-weight:900;font-style:italic;letter-spacing:-.03em;margin:0 0 18px;line-height:1.05}
h1 .slash{display:inline-block;width:26px;height:6px;border-radius:3px;background:var(--grad);margin-left:8px;transform:skewX(-20deg) translateY(-8px)}
b{font-weight:700}
.mute{color:var(--mute)}.small{font-size:13px}.acc{color:var(--acc)}.pink{color:var(--acc2)}.danger{color:var(--danger)!important}.r{text-align:right}.up{color:var(--danger)}.down{color:var(--good)}
.card{position:relative;background:var(--card);border:1px solid rgba(255,255,255,.04);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:block;box-sizing:border-box;width:100%;text-align:center;background:var(--grad);color:#fff;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:800;letter-spacing:.01em;box-shadow:0 6px 20px rgba(255,90,60,.25)}
.btn.ghost{background:var(--card2);color:var(--text);font-weight:600;box-shadow:none}
.btn.sm{width:auto;padding:10px 18px;border-radius:12px}
.btn:active,.tpl:active,.chk:active,.tap:active{transform:scale(.97)}
.mt{margin-top:10px}
.link{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;padding:10px 0}
.center{display:block;margin:14px auto 0}
.icon-btn{background:none;border:0;color:var(--mute);font-size:22px;line-height:1;padding:4px 8px;font-family:inherit}
/* train */
.week .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center}
.week .days span{font-size:11px;color:var(--mute);font-weight:600}
.dot{width:34px;height:34px;margin:4px auto 0;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mute)}
.dot.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(255,90,60,.35)}
.dot.today{box-shadow:inset 0 0 0 2px var(--acc)}
.dot.on.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.streak{font-weight:800;font-style:italic}
.tpl{position:relative;overflow:hidden;display:block;width:100%;text-align:left;background:var(--card);border:1px solid rgba(255,255,255,.04);color:inherit;border-radius:20px;padding:16px 16px 16px 20px;margin-bottom:10px;font:inherit;transition:transform .1s}
.tpl::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.tpl .num{position:absolute;right:58px;bottom:-22px;font-size:96px;font-weight:900;font-style:italic;color:rgba(255,255,255,.035);line-height:1;pointer-events:none}
.tpl b{font-size:21px;font-style:italic;font-weight:900}
.go{position:relative;width:42px;height:42px;flex:none;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 4px 14px rgba(255,90,60,.4)}
.clamp{position:relative;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.wk-head .btn{margin-bottom:22px}
.ex h3{margin:0;font-size:17px;font-weight:800}
.ex h3 .arrow{color:var(--mute);font-weight:400;font-size:14px}
.sets-h,.set{display:grid;grid-template-columns:32px 1fr 1fr 48px;gap:8px;align-items:center}
.sets-h{font-size:11px;letter-spacing:.08em;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;text-align:center;font-weight:700}
.set{margin-bottom:8px}
.set .n{color:var(--mute);font:inherit;font-weight:800;text-align:center;background:none;border:0;padding:0}
.set.pr .n{color:var(--acc2)}
.set input{width:100%;box-sizing:border-box;background:var(--card2);border:1px solid transparent;border-radius:11px;color:var(--text);padding:10px 4px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;font-family:inherit}
.set input:focus{outline:none;border-color:var(--acc)}
.set input::placeholder{color:#5c525e}
.chk{height:42px;border-radius:11px;border:0;background:var(--card2);color:var(--mute);font-size:18px;font-weight:800;transition:transform .1s}
.set.done input{background:rgba(255,122,26,.10);color:var(--acc)}
.set.done .chk{background:var(--grad);color:#fff}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats.two{grid-template-columns:1fr 1fr}
.stat{background:var(--card);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:900;font-style:italic;color:#fff;background:linear-gradient(135deg,#ff3d81,#ff7a1a);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.hist .d{font-size:13px;color:var(--mute)}
.hist .detail{margin-top:10px;border-top:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:7px;background:var(--card2);display:block}
.cal i.on{background:var(--grad)}
.cal i.today{box-shadow:inset 0 0 0 2px var(--acc)}
.cal i.fut{opacity:.35}
.cal span{font-size:10px;color:var(--mute);text-align:center;font-weight:700}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .mute{text-align:right}
.field{width:100%;box-sizing:border-box;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font-size:16px;font-family:inherit}
.field:focus{outline:none;border-color:var(--acc)}
.field.big{font-size:22px;font-weight:800}
.wrow{display:flex;gap:10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid label{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.mgrid .field{margin-top:4px;font-weight:700}
.chart{width:100%;height:160px;display:block;margin-bottom:8px}
.empty{color:var(--mute);text-align:center;padding:40px 16px}
.empty .jp{display:block;font-size:22px;font-weight:900;font-style:italic;margin-bottom:6px;color:var(--text)}
.lbl{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;font-weight:700}
.lbl.first{margin-top:0}.lbl.out{margin:22px 4px 8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px 6px;border-radius:10px;font:inherit;font-weight:700}
.seg button.on{background:var(--grad);color:#fff}
.seg.top{margin-bottom:14px}
label.btn{cursor:pointer}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(12,10,13,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0 7px;font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rest{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 72px);background:var(--grad);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;font-weight:800;display:flex;gap:8px;align-items:center;z-index:15;box-shadow:0 8px 30px rgba(255,80,60,.4);font-variant-numeric:tabular-nums}
.rest.hidden{display:none}
.rest button{border:0;background:rgba(0,0,0,.18);border-radius:999px;padding:7px 12px;font:inherit;font-weight:800;color:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#151017;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:84vh;overflow:auto;max-width:560px;margin:0 auto}
.sheet.anim{animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .field{margin:8px 0}
.grab{width:40px;height:5px;background:#3a3040;border-radius:3px;margin:0 auto 10px}
.st{font-size:20px;font-weight:900;font-style:italic}
.tap{cursor:pointer}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-20px);background:#2b222e;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* PR burst */
.burst{position:fixed;left:50%;top:42%;width:230px;height:230px;transform:translate(-50%,-50%) scale(0);z-index:40;pointer-events:none;opacity:0}
.burst svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 30px rgba(255,61,129,.5))}
.burst .bt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transform:rotate(-8deg)}
.burst .bt b{font-size:54px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1;text-shadow:3px 3px 0 #a3134a}
.burst .bt small{font-size:15px;font-weight:900;letter-spacing:.2em;margin-top:4px}
.burst.go{animation:pop 1.7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-25deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(0)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.lines{position:fixed;inset:0;z-index:39;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(255,255,255,.07) 0deg 2deg,transparent 2deg 9deg)}
.lines.go{animation:fl 1.2s ease forwards}
@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="glow"></div>
<main id="main"></main>
<div id="rest" class="rest hidden"><span>Rest <span id="restT"></span></span><button data-a="restAdd">+15</button><button data-a="restStop">✕</button></div>
<div id="sheet"></div>
<div id="toast" class="toast"></div>
<div id="lines" class="lines"></div>
<div id="burst" class="burst"><svg viewBox="0 0 200 200"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb03d"/><stop offset=".5" stop-color="#ff6a2a"/><stop offset="1" stop-color="#ff3d81"/></linearGradient></defs><polygon id="spikes" fill="url(#bg)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg><div class="bt"><b>PR!</b><small>新記録</small></div></div>
<nav class="tabs">
  <button data-a="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 6v12M18 6v12M3 9.5v5M21 9.5v5M6 12h12"/></svg>Train</button>
  <button data-a="tab" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-a="tab" data-tab="weight"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Body</button>
  <button data-a="tab" data-tab="data"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Data</button>
</nav>
<script>
const KEY='lift.v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const today=()=>dkey(Date.now());
const daysSince=ds=>Math.round((new Date(today())-new Date(ds))/864e5);
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtDay=ds=>{const [y,m,d]=ds.split('-');return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmtN=n=>Math.round(n*10)/10;
const sgn=n=>(n>0?'+':'')+fmtN(n);
const ago=ts=>{const d=Math.floor((Date.now()-ts)/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'};
const dur=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad2(m)}:${pad2(x)}`:`${m}:${pad2(x)}`};
const stat=(v,k)=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
const head=(kana,title)=>`<p class="kana">${kana}</p><h1>${title}<span class="slash"></span></h1>`;
const e1=(w,r)=>r<=1?w:w*(1+r/30);
const lenU=()=>S.unit==='lb'?'in':'cm';
const MEAS=['Waist','Chest','Hips','Arms','Thighs','Neck'];

const PLAN=[
 ['Push',[['Machine Chest Press',3,'8–12'],['Incline DB Press',3,'8–12'],['Pec Deck',3,'10–15'],['Machine Shoulder Press',3,'8–12'],['DB Lateral Raise',3,'12–15'],['Tricep Pushdown',3,'10–15']]],
 ['Pull',[['Lat Pulldown',3,'8–12'],['Seated Cable Row',3,'8–12'],['Chest-Supported Row',3,'8–12'],['Face Pull',3,'12–15'],['DB Curl',3,'10–15'],['DB Hammer Curl',2,'10–15']]],
 ['Legs',[['Leg Press',3,'8–12'],['Hack Squat',3,'8–12'],['Seated Leg Curl',3,'10–15'],['Leg Extension',3,'10–15'],['Hip Thrust Machine',3,'8–12'],['Calf Raise',3,'10–15'],['Cable Crunch',2,'10–15']]]];
const PLAN_V=3;
function applyPlan(o){o.templates=PLAN.map(([name,list])=>{const t={id:uid(),name,exerciseIds:[],targets:{}};list.forEach(([n,sets,reps])=>{let ex=o.exercises.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!ex){ex={id:uid(),name:n};o.exercises.push(ex)}t.exerciseIds.push(ex.id);t.targets[ex.id]={sets,reps}});return t});o.planV=PLAN_V;return o}
function seed(){return applyPlan({v:1,unit:'lb',rest:90,goal:3,exercises:[],templates:[],sessions:[],weights:[],measures:[],active:null})}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v){const o=Object.assign(seed(),d);if((d.planV||0)<PLAN_V&&!o.active){applyPlan(o);localStorage.setItem(KEY,JSON.stringify(o))}return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save!')}}

let S=load(),tab='train',htab='workouts',wtab='scale',sheet=null,q='',restEnd=0,openHist=null,ac=null,tt,mDraft={};

function exName(id){return (S.exercises.find(e=>e.id===id)||{name:'Exercise'}).name}
function lastSets(exId){for(let i=S.sessions.length-1;i>=0;i--){const en=S.sessions[i].entries.find(e=>e.exId===exId);if(en&&en.sets.length)return en.sets}return null}
function newSets(exId,n){const l=lastSets(exId);return Array.from({length:n||(l?l.length:3)},()=>({w:'',r:'',done:false}))}
function readyUp(exId,reps){const l=lastSets(exId);if(!l||!reps)return false;const top=parseInt(String(reps).split(/[–-]/).pop());return top>0&&l.every(x=>x.r>=top)}
function ph(exId,i){const l=lastSets(exId);return l?l[Math.min(i,l.length-1)]:null}
const curTpl=()=>S.templates.find(x=>x.id===sheet.id);
function liftHist(exId){return S.sessions.map(s=>{const en=s.entries.find(e=>e.exId===exId);if(!en)return null;let b=null;en.sets.forEach(x=>{const v=e1(x.w,x.r);if(!b||v>b.v)b={v,w:x.w,r:x.r}});return b&&{date:s.start,...b,prs:en.sets.filter(x=>x.pr).length,heavy:Math.max(...en.sets.map(x=>x.w))}}).filter(Boolean)}
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
function prevWeek(t){const d=new Date(t);d.setDate(d.getDate()-7);return d.getTime()}
function weekCounts(){const c={};S.sessions.forEach(s=>{const k=weekStart(s.start);c[k]=(c[k]||0)+1});return c}
function streak(){const c=weekCounts();let w=weekStart(Date.now()),n=0;if((c[w]||0)>=S.goal)n++;w=prevWeek(w);while((c[w]||0)>=S.goal){n++;w=prevWeek(w)}return n}
const trainedDays=()=>new Set(S.sessions.map(s=>dkey(s.start)));

function chart(vals,first,last,unit){
 if(vals.length<2)return `<div class="empty small">Need 2+ entries to draw a trend.</div>`;
 const mn=Math.min(...vals),mx=Math.max(...vals),pd=(mx-mn)*.15||1,lo=mn-pd,hi=mx+pd,Wd=320,H=150,id='c'+Math.random().toString(36).slice(2,7);
 const d=vals.map((v,i)=>(i?'L':'M')+(i/(vals.length-1)*Wd).toFixed(1)+' '+(H-(v-lo)/(hi-lo)*H).toFixed(1)).join(' ');
 return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a2a" stop-opacity=".32"/><stop offset="1" stop-color="#ff3d81" stop-opacity="0"/></linearGradient><linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffa23d"/><stop offset="1" stop-color="#ff3d81"/></linearGradient></defs><path d="${d} L${Wd} ${H} L0 ${H} Z" fill="url(#${id}f)"/><path d="${d}" fill="none" stroke="url(#${id}s)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="row mute small"><span>${first}</span><span>${fmtN(mn)}–${fmtN(mx)} ${unit}</span><span>${last}</span></div>`;
}

/* ---------- views ---------- */
function weekCard(){
 const ws=weekStart(Date.now()),td=trainedDays(),t=today(),cnt=weekCounts()[ws]||0,st=streak();
 const days=['M','T','W','T','F','S','S'].map((l,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);const k=dkey(d);return `<div><span>${l}</span><div class="dot${td.has(k)?' on':''}${k===t?' today':''}">${d.getDate()}</div></div>`}).join('');
 return `<div class="card week"><div class="row"><span><b>${cnt}/${S.goal}</b> <span class="mute small">this week</span></span><span class="streak ${st?'acc':'mute'}">${st?'🔥 '+st+'-week streak':'Start a streak'}</span></div><div class="days">${days}</div></div>`;
}
function vTrain(){
 const A=S.active;
 if(!A){
  const tpls=S.templates.map((t,i)=>{const last=[...S.sessions].reverse().find(s=>s.tplId===t.id);
   return `<button class="tpl" data-a="start" data-id="${t.id}"><span class="num">${pad2(i+1)}</span><div class="row"><div><b>${esc(t.name)}</b><div class="mute small">${t.exerciseIds.length} exercises${last?' · '+ago(last.start):''}</div></div><span class="go">▶</span></div><div class="mute small clamp">${esc(t.exerciseIds.map(exName).join(' · '))||'No exercises yet'}</div></button>`}).join('');
  return `${head('トレーニング','Train')}${weekCard()}${tpls}<button class="btn ghost" data-a="start" data-id="">Empty workout</button>`;
 }
 const ex=A.entries.map((en,ei)=>{
  const sets=en.sets.map((s,si)=>{const p=ph(en.exId,si);
   return `<div class="set${s.done?' done':''}${s.pr?' pr':''}"><button class="n" data-a="rmSet" data-e="${ei}" data-s="${si}">${s.pr?'★':si+1}</button><input data-f="w" data-e="${ei}" data-s="${si}" inputmode="decimal" placeholder="${p?fmtN(p.w):'—'}" value="${esc(s.w)}"><input data-f="r" data-e="${ei}" data-s="${si}" inputmode="numeric" placeholder="${p?p.r:'—'}" value="${esc(s.r)}"><button class="chk" data-a="chk" data-e="${ei}" data-s="${si}">✓</button></div>`}).join('');
  const l=lastSets(en.exId);
  return `<div class="card ex"><div class="row"><h3 class="tap" data-a="sheet" data-t="lift" data-id="${en.exId}">${esc(exName(en.exId))} <span class="arrow">›</span></h3><button class="icon-btn" data-a="rmEx" data-e="${ei}">×</button></div><div class="mute small">${en.target?`<span class="acc"><b>${en.target.sets} × ${en.target.reps}</b></span>${l?' · ':''}`:''}${l?`Last: ${l.map(s=>`${fmtN(s.w)}×${s.r}`).join(', ')}`:''}${en.target&&readyUp(en.exId,en.target.reps)?' <span class="badge">↑ Add weight</span>':''}</div><div class="sets-h"><span>Set</span><span>${S.unit}</span><span>Reps</span><span></span></div>${sets}<button class="link" data-a="addSet" data-e="${ei}">+ Add set</button></div>`;
 }).join('');
 return `<div class="wk-head"><div><p class="kana">トレーニング中 · <span id="elapsed">${dur(Date.now()-A.start)}</span></p><h1>${esc(A.name)}<span class="slash"></span></h1></div><button class="btn sm" data-a="finish">Finish</button></div>${ex}<button class="btn ghost" data-a="sheet" data-t="addEx">+ Add exercise</button><button class="link danger center" data-a="cancel">Cancel workout</button>`;
}

function calendar(){
 const td=trainedDays(),t=today();let w=weekStart(Date.now());for(let i=0;i<4;i++)w=prevWeek(w);
 let h=['M','T','W','T','F','S','S'].map(l=>`<span>${l}</span>`).join('');
 for(let i=0;i<35;i++){const d=new Date(w);d.setDate(d.getDate()+i);const k=dkey(d);h+=`<i class="${td.has(k)?'on':''}${k===t?' today':''}${k>t?' fut':''}"></i>`}
 return `<div class="card"><div class="row"><b>Last 5 weeks</b><span class="mute small">${S.sessions.filter(s=>Date.now()-s.start<35*864e5).length} workouts</span></div><div class="cal">${h}</div></div>`;
}
function vHistory(){
 const seg=`<div class="seg top">${[['workouts','Workouts'],['lifts','Lifts']].map(([k,l])=>`<button class="${htab===k?'on':''}" data-a="htab" data-v="${k}">${l}</button>`).join('')}</div>`;
 if(!S.sessions.length)return `${head('きろく','History')}<div class="empty"><span class="jp">まだ何もない…</span>No workouts yet. Finish one and it shows up here.</div>`;
 if(htab==='lifts'){
  const rows=S.exercises.map(e=>({e,h:liftHist(e.id)})).filter(x=>x.h.length).sort((a,b)=>b.h[b.h.length-1].date-a.h[a.h.length-1].date).map(({e,h})=>{
   const best=h.reduce((a,b)=>b.v>a.v?b:a),prs=h.reduce((n,x)=>n+x.prs,0);
   return `<div class="list-row tap" data-a="sheet" data-t="lift" data-id="${e.id}"><div><b>${esc(e.name)}</b>${prs?`<span class="badge">★ ${prs}</span>`:''}<div class="mute small">Best ${fmtN(best.w)}×${best.r} · ${h.length} sessions</div></div><div class="r"><b>${Math.round(best.v)}</b><div class="mute small">est. 1RM ›</div></div></div>`}).join('');
  return `${head('きろく','History')}${seg}<div class="card">${rows}</div>`;
 }
 return `${head('きろく','History')}${seg}${calendar()}`+[...S.sessions].reverse().map(s=>{
  const sets=s.entries.reduce((n,e)=>n+e.sets.length,0),vol=s.entries.reduce((n,e)=>n+e.sets.reduce((m,x)=>m+x.w*x.r,0),0),prs=s.entries.reduce((n,e)=>n+e.sets.filter(x=>x.pr).length,0);
  return `<div class="card hist tap" data-a="hist" data-id="${s.id}"><div class="row"><div><b>${esc(s.name)}</b>${prs?`<span class="badge">★ ${prs} PR${prs>1?'s':''}</span>`:''}<div class="d">${fmtDate(s.start)} · ${Math.max(1,Math.round((s.end-s.start)/60000))} min</div></div><div class="r"><b>${Math.round(vol).toLocaleString()}</b><div class="d">${S.unit} · ${sets} set${sets===1?'':'s'}</div></div></div>${openHist===s.id?`<div class="detail">${s.entries.map(e=>`<div class="list-row"><span>${esc(exName(e.exId))}</span><span class="mute small">${e.sets.map(x=>`${x.pr?'<span class="pink">★</span>':''}${fmtN(x.w)}×${x.r}`).join('  ')}</span></div>`).join('')}<button class="link danger" data-a="delSess" data-id="${s.id}">Delete workout</button></div>`:''}</div>`}).join('');
}

function measLatest(k){for(let i=S.measures.length-1;i>=0;i--)if(S.measures[i].m[k]!=null)return S.measures[i];return null}
function measFirst(k){return S.measures.find(x=>x.m[k]!=null)}
function vWeight(){
 const seg=`<div class="seg top">${[['scale','Scale'],['body','Measurements']].map(([k,l])=>`<button class="${wtab===k?'on':''}" data-a="wtab" data-v="${k}">${l}</button>`).join('')}</div>`;
 if(wtab==='body'){
  const inputs=MEAS.map(k=>{const l=measLatest(k);return `<div><label>${k}</label><input class="field" data-m="${k}" inputmode="decimal" placeholder="${l?fmtN(l.m[k]):'—'} ${lenU()}" value="${esc(mDraft[k]||'')}"></div>`}).join('');
  const list=MEAS.map(k=>{const l=measLatest(k);if(!l)return '';const f=measFirst(k),dl=l.m[k]-f.m[k];return `<div class="list-row tap" data-a="sheet" data-t="meas" data-id="${k}"><span>${k}</span><span><b>${fmtN(l.m[k])}</b> <span class="mute small">${lenU()}</span>${f!==l?` <span class="small ${!dl?'mute':(dl<0)===['Waist','Hips'].includes(k)?'down':'up'}">${sgn(dl)}</span>`:''} <span class="mute">›</span></span></div>`}).join('');
  return `${head('たいじゅう','Body')}${seg}<div class="card"><div class="mgrid">${inputs}</div><button class="btn mt" data-a="saveM">Save today's measurements</button><div class="mute small" style="margin-top:8px">Fill in only what you measured. Tip: every 2–4 weeks, same time of day.</div></div>${list?`<div class="card">${list}</div>`:''}`;
 }
 const W=S.weights,cur=W.length?W[W.length-1].w:null;
 const wk=W.filter(x=>daysSince(x.date)<7),avg=wk.length?wk.reduce((a,b)=>a+b.w,0)/wk.length:null;
 const base=W.find(x=>daysSince(x.date)<=30),chg=cur!=null&&base&&base!==W[W.length-1]?cur-base.w:null;
 const logged=W.some(x=>x.date===today()),p=W.slice(-60);
 return `${head('たいじゅう','Body')}${seg}<div class="card"><div class="wrow"><input id="wIn" class="field big" inputmode="decimal" placeholder="${cur?fmtN(cur):'Today'} ${S.unit}"><button class="btn sm" data-a="logW">Log</button></div><div class="mute small" style="margin-top:8px">${logged?'Logged today · logging again replaces it':'Tip: weigh in each morning, same conditions'}</div></div>
 <div class="stats">${stat(cur?fmtN(cur):'—','Current')}${stat(avg?fmtN(avg):'—','7-day avg')}${stat(chg==null?'—':sgn(chg),'30 days')}</div>
 <div class="card">${chart(p.map(x=>x.w),p[0]?fmtDay(p[0].date):'',p.length?fmtDay(p[p.length-1].date):'',S.unit)}</div>
 ${W.length?`<div class="card">${[...W].reverse().slice(0,30).map(x=>`<div class="list-row"><span>${fmtDay(x.date)}</span><span><b>${fmtN(x.w)}</b> <span class="mute small">${S.unit}</span><button class="icon-btn" data-a="delW" data-d="${x.date}">×</button></span></div>`).join('')}</div>`:''}`;
}

function vData(){
 const seg=(arr,key,act,lab)=>`<div class="seg">${arr.map(v=>`<button class="${S[key]===v?'on':''}" data-a="${act}" data-v="${v}">${lab(v)}</button>`).join('')}</div>`;
 return `${head('データ','Data')}<div class="card"><div class="lbl first">Units</div>${seg(['lb','kg'],'unit','unit',v=>v==='lb'?'lb · in':'kg · cm')}
 <div class="lbl">Rest timer</div>${seg([60,90,120,180],'rest','rest',s=>s<120?s+'s':s/60+'m')}
 <div class="lbl">Weekly goal</div>${seg([2,3,4,5,6],'goal','goal',v=>v+'×')}</div>
 <div class="lbl out">Templates</div><div class="card">${S.templates.map(t=>`<div class="list-row tap" data-a="sheet" data-t="tpl" data-id="${t.id}"><span>${esc(t.name)}</span><span class="mute">${t.exerciseIds.length} ›</span></div>`).join('')}<button class="link" data-a="newTpl">+ New template</button></div>
 <div class="lbl out">Backup &amp; analysis</div><div class="card"><button class="btn" data-a="export">Export file</button><button class="btn ghost mt" data-a="copy">Copy data</button><label class="btn ghost mt">Import backup<input type="file" id="imp" accept=".json,application/json" hidden></label><p class="mute small">Export and send the file to Claude for analysis. Doing it now and then also keeps a backup.</p></div>
 <div class="card"><div class="row"><span>Stored on this iPhone only</span><span class="mute small" id="persist"></span></div><button class="link danger" data-a="reset">Erase all data</button></div>
 <p class="mute small" style="text-align:center">${S.sessions.length} workouts · ${S.weights.length} weigh-ins · ${S.measures.length} measurement days</p>`;
}

function exList(){const ql=q.trim().toLowerCase(),list=S.exercises.filter(e=>e.name.toLowerCase().includes(ql)).sort((a,b)=>a.name.localeCompare(b.name)),exact=S.exercises.some(e=>e.name.toLowerCase()===ql);
 return (ql&&!exact?`<div class="list-row tap acc" data-a="newEx"><span>+ Create “${esc(q.trim())}”</span></div>`:'')+list.map(e=>`<div class="list-row tap" data-a="pickEx" data-id="${e.id}"><span>${esc(e.name)}</span><span class="acc">+</span></div>`).join('')}

function renderSheet(){
 const el=$('#sheet');if(!sheet){el.innerHTML='';return}
 let h='';const close=`<button class="link" data-a="closeSheet">Done</button>`;
 if(sheet.t==='addEx')h=`<div class="row"><b class="st">Add exercise</b><button class="link" data-a="${sheet.tplId?'backTpl':'closeSheet'}">${sheet.tplId?'Back':'Close'}</button></div><input id="q" class="field" placeholder="Search or create new" value="${esc(q)}" autocomplete="off"><div id="qlist">${exList()}</div>`;
 if(sheet.t==='tpl'){const t=curTpl();if(!t){sheet=null;el.innerHTML='';return}
  h=`<div class="row"><b class="st">Edit template</b>${close}</div><input class="field" data-f="tplname" value="${esc(t.name)}">${t.exerciseIds.map((id,i)=>`<div class="list-row"><span>${esc(exName(id))}</span><span>${i?`<button class="icon-btn" data-a="tplUp" data-i="${i}">↑</button>`:''}<button class="icon-btn" data-a="tplRm" data-i="${i}">×</button></span></div>`).join('')}<button class="link" data-a="sheet" data-t="addEx" data-tpl="${t.id}">+ Add exercise</button><br><button class="link danger" data-a="delTpl">Delete template</button>`}
 if(sheet.t==='lift'){const hs=liftHist(sheet.id);
  if(!hs.length)h=`<div class="row"><b class="st">${esc(exName(sheet.id))}</b>${close}</div><div class="empty small">No history yet — finish a workout with this lift.</div>`;
  else{const best=hs.reduce((a,b)=>b.v>a.v?b:a),heavy=Math.max(...hs.map(x=>x.heavy));
   h=`<div class="row"><b class="st">${esc(exName(sheet.id))}</b>${close}</div><div class="stats" style="margin-top:8px">${stat(Math.round(best.v),'Est. 1RM')}${stat(fmtN(heavy),'Heaviest')}${stat(hs.length,'Sessions')}</div><div class="lbl first">Estimated 1-rep max</div>${chart(hs.map(x=>x.v),fmtDate(hs[0].date),fmtDate(hs[hs.length-1].date),S.unit)}<div class="lbl">Recent · best set</div>${[...hs].reverse().slice(0,10).map(x=>`<div class="list-row"><span>${fmtDate(x.date)}</span><span>${x.prs?'<span class="pink">★</span> ':''}<b>${fmtN(x.w)}×${x.r}</b> <span class="mute small">≈${Math.round(x.v)}</span></span></div>`).join('')}`}}
 if(sheet.t==='meas'){const k=sheet.id,ent=S.measures.filter(x=>x.m[k]!=null);
  h=`<div class="row"><b class="st">${k}</b>${close}</div>${chart(ent.map(x=>x.m[k]),ent[0]?fmtDay(ent[0].date):'',ent.length?fmtDay(ent[ent.length-1].date):'',lenU())}${[...ent].reverse().map(x=>`<div class="list-row"><span>${fmtDay(x.date)}</span><span><b>${fmtN(x.m[k])}</b> <span class="mute small">${lenU()}</span><button class="icon-btn" data-a="delM" data-d="${x.date}">×</button></span></div>`).join('')}`}
 el.innerHTML=`<div class="scrim" data-a="closeSheet"></div><div class="sheet${sheet.fresh?' anim':''}"><div class="grab"></div>${h}</div>`;
 sheet.fresh=false;
}

function render(){
 $('#main').innerHTML={train:vTrain,history:vHistory,weight:vWeight,data:vData}[tab]();
 document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 renderSheet();tick();
 if(tab==='data'&&navigator.storage&&navigator.storage.persisted)navigator.storage.persisted().then(p=>{const e=$('#persist');if(e)e.textContent=p?'Protected ✓':''});
}

/* ---------- actions ---------- */
function burst(){['#burst','#lines'].forEach(s=>{const el=$(s);el.classList.remove('go');void el.offsetWidth;el.classList.add('go')});prBeep()}
function addEx(id){
 if(sheet&&sheet.tplId){const t=S.templates.find(x=>x.id===sheet.tplId);t.exerciseIds.push(id);save();sheet={t:'tpl',id:t.id};renderSheet();return}
 S.active.entries.push({exId:id,sets:newSets(id)});save();sheet=null;render();
 setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),50);
}
function finish(){
 const A=S.active;
 const entries=A.entries.map(en=>({exId:en.exId,sets:en.sets.filter(s=>s.done).map(s=>{const o={w:num(s.w),r:Math.round(num(s.r))};if(s.pr)o.pr=true;return o})})).filter(en=>en.sets.length);
 if(!entries.length){if(!confirm('No completed sets. Discard this workout?'))return;S.active=null}
 else{
  const loose=A.entries.some(en=>en.sets.some(s=>!s.done&&(s.w!==''||s.r!=='')));
  if(loose&&!confirm("Some sets aren't checked off and will be dropped. Finish anyway?"))return;
  S.sessions.push({id:A.id,tplId:A.tplId,name:A.name,start:A.start,end:Date.now(),entries});
  const prs=entries.reduce((n,e)=>n+e.sets.filter(x=>x.pr).length,0);
  S.active=null;tab='history';htab='workouts';openHist=A.id;toast(prs?`Saved · ${prs} new PR${prs>1?'s':''}! 🔥`:'Workout saved · お疲れ様!');
 }
 restEnd=0;save();window.scrollTo(0,0);
}
function logW(){
 const v=num($('#wIn').value);if(!v){toast('Enter a weight');return}
 const d=today();S.weights=S.weights.filter(x=>x.date!==d);S.weights.push({date:d,w:v});
 S.weights.sort((a,b)=>a.date<b.date?-1:1);save();toast('Logged');render();
}
function saveM(){
 const vals={};for(const k in mDraft){const v=num(mDraft[k]);if(v)vals[k]=v}
 if(!Object.keys(vals).length){toast('Enter at least one measurement');return}
 const d=today();let e=S.measures.find(x=>x.date===d);if(!e){e={date:d,m:{}};S.measures.push(e)}
 Object.assign(e.m,vals);S.measures.sort((a,b)=>a.date<b.date?-1:1);mDraft={};save();toast('Measurements saved');render();
}
function dump(){return JSON.stringify(Object.assign({app:'Lift',exportedAt:new Date().toISOString()},S))}
async function exportData(){
 const name=`lift-backup-${today()}.json`,file=new File([dump()],name,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
}
function importFile(f){if(!f)return;
 f.text().then(txt=>{const d=JSON.parse(txt);
  if(!Array.isArray(d.sessions)||!Array.isArray(d.weights)||!Array.isArray(d.exercises))throw 0;
  if(!confirm(`Replace current data with this backup (${d.sessions.length} workouts, ${d.weights.length} weigh-ins)?`))return;
  delete d.app;delete d.exportedAt;S=Object.assign(seed(),d);save();render();toast('Backup restored');
 }).catch(()=>toast('Not a valid backup file'));
}
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,t,len){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.22,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+len);o.connect(g).connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+len+.01)}
function beep(){try{if(ac){tone(880,0,.15);tone(880,.18,.15)}}catch(e){}}
function prBeep(){try{if(ac){tone(660,0,.1);tone(880,.1,.1);tone(1320,.2,.25)}}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
function tick(){
 const el=$('#elapsed');if(el&&S.active)el.textContent=dur(Date.now()-S.active.start);
 const r=$('#rest');
 if(restEnd){const left=restEnd-Date.now();if(left<=0){restEnd=0;beep();r.classList.add('hidden');toast('Rest over — next set! 💪')}else{r.classList.remove('hidden');$('#restT').textContent=dur(left+999)}}
 else r.classList.add('hidden');
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,d=el.dataset,A=S.active;
 switch(a){
  case 'tab':tab=d.tab;sheet=null;window.scrollTo(0,0);break;
  case 'htab':htab=d.v;break;
  case 'wtab':wtab=d.v;break;
  case 'start':{if(A){tab='train';break}const t=S.templates.find(x=>x.id===d.id);
   S.active={id:uid(),tplId:t?t.id:null,name:t?t.name:'Workout',start:Date.now(),entries:t?t.exerciseIds.map(exId=>{const tg=(t.targets||{})[exId];return {exId,target:tg,sets:newSets(exId,tg&&tg.sets)}}):[]};save();window.scrollTo(0,0);break}
  case 'chk':{unlock();const en=A.entries[+d.e],s=en.sets[+d.s];
   if(s.done){s.done=false;s.pr=false}
   else{const p=ph(en.exId,+d.s);if(s.w===''&&p)s.w=String(p.w);if(s.r===''&&p)s.r=String(p.r);
    if(s.w===''||s.r===''){toast('Enter weight and reps');return}
    s.done=true;restEnd=Date.now()+S.rest*1000;
    const hs=liftHist(en.exId),v=e1(num(s.w),num(s.r));
    if(hs.length&&num(s.w)>0){const prev=Math.max(...hs.map(h=>h.v)),cur=Math.max(0,...en.sets.filter(x=>x!==s&&x.done).map(x=>e1(num(x.w),num(x.r))));
     if(v>prev+.01&&v>cur){s.pr=true;burst()}}}
   save();break}
  case 'addSet':{const en=A.entries[+d.e],pr=en.sets[en.sets.length-1];en.sets.push({w:pr?pr.w:'',r:pr?pr.r:'',done:false});save();break}
  case 'rmSet':if(!confirm(`Remove set ${+d.s+1}?`))return;A.entries[+d.e].sets.splice(+d.s,1);save();break;
  case 'rmEx':if(!confirm(`Remove ${exName(A.entries[+d.e].exId)}?`))return;A.entries.splice(+d.e,1);save();break;
  case 'finish':finish();break;
  case 'cancel':if(!confirm('Discard this workout?'))return;S.active=null;restEnd=0;save();break;
  case 'sheet':q='';sheet={t:d.t,id:d.id,tplId:d.tpl,fresh:true};renderSheet();return;
  case 'closeSheet':sheet=null;break;
  case 'backTpl':sheet={t:'tpl',id:sheet.tplId};renderSheet();return;
  case 'pickEx':addEx(d.id);return;
  case 'newEx':{const name=q.trim();if(!name)return;const ex={id:uid(),name};S.exercises.push(ex);addEx(ex.id);return}
  case 'tplRm':curTpl().exerciseIds.splice(+d.i,1);save();renderSheet();return;
  case 'tplUp':{const x=curTpl().exerciseIds,i=+d.i;[x[i-1],x[i]]=[x[i],x[i-1]];save();renderSheet();return}
  case 'delTpl':{const t=curTpl();if(!confirm(`Delete "${t.name}"?`))return;S.templates=S.templates.filter(x=>x!==t);sheet=null;save();break}
  case 'newTpl':{const t={id:uid(),name:'New template',exerciseIds:[]};S.templates.push(t);save();sheet={t:'tpl',id:t.id,fresh:true};break}
  case 'hist':openHist=openHist===d.id?null:d.id;break;
  case 'delSess':if(!confirm('Delete this workout?'))return;S.sessions=S.sessions.filter(s=>s.id!==d.id);save();break;
  case 'logW':logW();return;
  case 'saveM':saveM();return;
  case 'delW':if(!confirm('Delete this weigh-in?'))return;S.weights=S.weights.filter(x=>x.date!==d.d);save();break;
  case 'delM':{if(!confirm('Delete this entry?'))return;const e=S.measures.find(x=>x.date===d.d);if(e){delete e.m[sheet.id];if(!Object.keys(e.m).length)S.measures=S.measures.filter(x=>x!==e)}save();break}
  case 'unit':S.unit=d.v;save();break;
  case 'rest':S.rest=+d.v;save();break;
  case 'goal':S.goal=+d.v;save();break;
  case 'restAdd':restEnd+=15000;tick();return;
  case 'restStop':restEnd=0;tick();return;
  case 'export':exportData();return;
  case 'copy':navigator.clipboard.writeText(dump()).then(()=>toast('Copied — paste it to Claude'),()=>toast('Copy failed'));return;
  case 'reset':if(!confirm('Erase ALL workouts, weigh-ins and measurements? Export a backup first.')||!confirm('Really erase everything?'))return;S=seed();save();break;
 }
 render();
});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;
 if(f==='w'||f==='r'){S.active.entries[+t.dataset.e].sets[+t.dataset.s][f]=t.value;save()}
 else if(f==='tplname'){curTpl().name=t.value;save()}
 else if(t.dataset.m){mDraft[t.dataset.m]=t.value}
 else if(t.id==='q'){q=t.value;$('#qlist').innerHTML=exList()}
});
document.addEventListener('change',e=>{if(e.target.id==='imp')importFile(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='wIn')logW()});
(()=>{const p=[];for(let i=0;i<32;i++){const a=i/32*Math.PI*2,r=i%2?68:96;p.push((100+r*Math.cos(a)).toFixed(1)+','+(100+r*Math.sin(a)).toFixed(1))}$('#spikes').setAttribute('points',p.join(' '))})();
setInterval(tick,500);
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>
